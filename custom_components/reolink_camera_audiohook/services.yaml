say:
  fields:
    camera:
      example: media_player.camera_speaker
      selector:
        entity:
          filter:
            integration: reolink_camera_audiohook
            domain: media_player
    channel:
      example: 0
      selector:
        number:
          min: 0
          max: 255
          mode: box
    config_entry_id:
      selector:
        config_entry:
          integration: reolink_camera_audiohook
    message:
      required: true
      example: "Hello, please leave the parcel by the door"
      selector:
        text:
          multiline: true
    voice:
      example: en-US-JennyNeural
      selector:
        text:
    volume:
      example: 100
      selector:
        number:
          min: 0
          max: 200
          step: 5
          unit_of_measurement: "%"
          mode: slider

play_file:
  fields:
    camera:
      example: media_player.camera_speaker
      selector:
        entity:
          filter:
            integration: reolink_camera_audiohook
            domain: media_player
    channel:
      example: 0
      selector:
        number:
          min: 0
          max: 255
          mode: box
    config_entry_id:
      selector:
        config_entry:
          integration: reolink_camera_audiohook
    media_content_id:
      required: true
      example: "media-source://media_source/local/doorbell.mp3"
      selector:
        text:
    volume:
      example: 100
      selector:
        number:
          min: 0
          max: 200
          step: 5
          unit_of_measurement: "%"
          mode: slider
